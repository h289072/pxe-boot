services:

  os-image-processor:
    build: ./os-image-processor
    user: "65532:10000"
    # command: tail -f /dev/null
    cap_drop:
      - ALL
    volumes:
      - ./meta.json:/data/meta.json  # Bind mount the meta.json from host to container
      - unpacked-iso:/data/unpacked-iso
      - work:/data/work
      - images:/data/images
    environment:
      METADATA_FILE: /data/meta.json
      UNPACKED_ISO_DIR: /data/unpacked-iso

  dnsmasq:
    build: ./dnsmasq
    network_mode: host
    user: "100:10000"
    # command: tail -f /dev/null
    cap_drop:
      - ALL
    cap_add:
      - CAP_NET_BIND_SERVICE
      - CAP_NET_RAW
      - CAP_NET_ADMIN
    restart: unless-stopped
    volumes:
      - ./meta.json:/data/meta.json:ro  # Bind mount the meta.json from host to container
      - unpacked-iso:/data/unpacked-iso:ro
      - shared_config:/data/config:rw
    environment:
      METADATA_FILE: /data/meta.json
      UNPACKED_ISO_DIR: /data/unpacked-iso

  lighttp:
    build: ./lighttp
    network_mode: host
    user: "100:10000"
    # command: tail -f /dev/null
    cap_drop:
      - ALL
    cap_add:
      - CAP_NET_BIND_SERVICE
    restart: unless-stopped
    volumes:
      - unpacked-iso:/data/unpacked-iso:ro
      - images:/data/images:ro
      - shared_config:/data/config:ro
    environment:
      WWW_DIR: /data
      UNPACKED_ISO_DIR: /data/unpacked-iso
      IMAGE_DIR: /data/images
    tmpfs:
      - /tmp

volumes:
  unpacked-iso:
  work:
  images:
  shared_config:
